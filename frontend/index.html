  <body class="antialiased" style="background-color:#08080c">
    <script>
      // Prevent white flash: apply dark mode before first paint
      try {
        var raw = localStorage.getItem('vectorpagamentos-theme') || '{}';
        var stored = JSON.parse(raw);
        var theme = stored && stored.state && stored.state.theme;
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else if (theme === 'light') {
          document.body.style.backgroundColor = '#FAFAFA';
        } else {
          // Default to dark
          document.documentElement.classList.add('dark');
        }
      } catch(e) {
        document.documentElement.classList.add('dark');
      }
    </script>
