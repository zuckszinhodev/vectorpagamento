<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" href="/favicon.png?v=3" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Gateway de Pagamento</title>
    <meta name="title" content="Gateway de Pagamento Completo | Checkout, Afiliados e Gestão Financeira" />
    <meta name="description" content="Plataforma completa de pagamentos com checkout personalizável, sistema de afiliados, gestão de produtos digitais e físicos, webhooks, API robusta e muito mais. Aceite pagamentos com PIX, cartão de crédito e boleto." />
    <meta name="keywords" content="gateway de pagamento, checkout, afiliados, pagamento online, pix, cartão de crédito, boleto, api de pagamento, webhook, gestão financeira, produtos digitais, ecommerce" />
    <meta name="author" content="Zuckszinho" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="Portuguese" />
    <meta name="revisit-after" content="7 days" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#08080c" />
    <meta name="msapplication-TileColor" content="#08080c" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gorillapay.tech/" />
    <meta property="og:title" content="GorillaPay - Gateway de Pagamento Completo" />
    <meta property="og:description" content="Plataforma completa de pagamentos com checkout personalizável, sistema de afiliados, gestão de produtos digitais e físicos. Aceite PIX, cartão e boleto." />
    <meta property="og:site_name" content="GorillaPay" />
    <meta property="og:locale" content="pt_BR" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="https://gorillapay.tech/" />
    <meta name="twitter:title" content="GorillaPay - Gateway de Pagamento Completo" />
    <meta name="twitter:description" content="Plataforma completa de pagamentos com checkout personalizável, sistema de afiliados, gestão de produtos digitais e físicos. Aceite PIX, cartão e boleto." />

    <!-- Canonical: definido por página pelo componente SEO (um segundo canonical fixo aqui conflitava). -->

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Logo das telas de login/cadastro: é o LCP no celular e só seria descoberto
         depois do JavaScript. Pré-carrega apenas nessas rotas, para não pesar no checkout. -->
    <script>
      (function () {
        if (!/^\/(login|register|forgot-password)?\/?$/.test(location.pathname)) return;
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'image';
        l.href = '/img/gorillapay-logo-320.webp';
        l.media = '(max-width: 1023px)';
        l.setAttribute('fetchpriority', 'high');
        document.head.appendChild(l);
      })();
    </script>

    <!-- Fonts -->
    <link rel="preload" href="/fonts/coolvetica-rg-it.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Carregada sem bloquear a renderização: o texto aparece na fonte do sistema e troca (display=swap). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
  </head>
  <body class="antialiased" style="background-color:#08080c">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
