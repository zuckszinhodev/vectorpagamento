openapi: 3.1.0
info:
  title: WazerPay Gateway API
  version: 1.0.0
  description: |
    API do WazerPay Gateway para processamento de pagamentos via PIX, Cartao de Credito e Boleto.

    ## Visao Geral

    O WazerPay Gateway permite que voce integre pagamentos no seu sistema de forma simples e segura.
    Crie checkouts personalizados, processe cobrancas via PIX, cartao ou boleto, e acompanhe todas as transacoes em tempo real.

    **Adquirente Principal:** PayFort Bank (PIX) - Taxa fixa de R$ 0,90 por transacao.

    ## Autenticacao

    Todas as requisicoes a API devem ser autenticadas com uma **API Key** enviada no header `X-API-Key`.

    ### Endpoints Externos vs Internos

    A API possui dois grupos de endpoints:

    | Tipo | Prefixo | Autenticação | Uso |
    |---|---|---|---|
    | **Externo** | `/api/v1/external/*` | API Key (X-API-Key) | Integrações externas, webhooks, apps |
    | **Interno** | `/api/v1/*` | JWT Token (Bearer) | Dashboard, painel administrativo |

    > **IMPORTANTE:** Para criar cobranças via API Key, use sempre o endpoint `/api/v1/external/charges`.
    > O endpoint `/api/v1/charges` (sem `/external/`) requer autenticação JWT e retornará erro 500 com API Key.

    ### Tipos de chave

    O WazerPay possui **dois tipos de chaves** com niveis de acesso diferentes:

    | Tipo | Prefixo | Permissoes | Uso |
    |---|---|---|---|
    | **Secreta** | `sk_live_` / `sk_test_` | Acesso completo (leitura + escrita) | Servidor (backend) |
    | **Publica** | `pk_live_` / `pk_test_` | Somente leitura | Frontend / cliente |

    > **IMPORTANTE:** Para criar cobrancas, gerenciar checkouts, processar pagamentos e outras operacoes de escrita, voce PRECISA de uma **chave secreta** (`sk_live_`).
    > Chaves publicas (`pk_live_`) retornarao **403 Insufficient permissions** em operacoes de escrita.

    ### Como obter sua API Key

    1. Acesse o painel WazerPay em [app.wazerpay.com.br](https://app.wazerpay.com.br)
    2. Va em **Configuracoes** no menu lateral
    3. Clique na aba **Chaves API**
    4. Clique em **Nova Chave**
    5. Selecione o **tipo**: Secreta (sk_) para acesso completo ou Publica (pk_) para somente leitura
    6. De um nome para identificar a chave (ex: "Meu E-commerce", "App Mobile")
    7. Selecione o ambiente (Producao ou Sandbox)
    8. Clique em **Criar** e copie a chave gerada

    > **Importante:** A chave so e exibida uma vez. Guarde-a em local seguro.

    ### Permissoes disponiveis

    **Chaves secretas (`sk_live_`) tem todas as permissoes por padrao (`*`).**
    Chaves publicas (`pk_live_`) so podem ter permissoes de leitura.

    | Permissao | Descricao | pk_ | sk_ |
    |---|---|---|---|
    | `charges:read` | Listar e visualizar cobrancas | Sim | Sim |
    | `charges:write` | Criar, cancelar e estornar cobrancas | Nao | Sim |
    | `payments:read` | Consultar pagamentos e metodos | Sim | Sim |
    | `payments:write` | Processar pagamentos | Nao | Sim |
    | `checkouts:read` | Listar e visualizar checkouts | Sim | Sim |
    | `checkouts:write` | Criar, atualizar e remover checkouts | Nao | Sim |
    | `products:read` | Listar e visualizar produtos | Sim | Sim |
    | `products:write` | Criar, atualizar e remover produtos | Nao | Sim |
    | `customers:read` | Listar e visualizar clientes | Sim | Sim |
    | `customers:write` | Criar e atualizar clientes | Nao | Sim |
    | `webhooks:read` | Listar webhooks | Sim | Sim |
    | `webhooks:write` | Criar, atualizar e remover webhooks | Nao | Sim |
    | `withdrawals:read` | Listar e visualizar saques | Sim | Sim |
    | `withdrawals:write` | Solicitar e cancelar saques | Nao | Sim |

    ### Como usar a API Key

    Inclua o header `X-API-Key` em todas as requisicoes:

    ```bash
    # Use sua chave SECRETA (sk_live_) para operacoes de escrita
    curl -X GET https://api.wazerpay.com.br/api/v1/external/charges \
      -H "X-API-Key: sk_live_sua_chave_secreta_aqui" \
      -H "Content-Type: application/json"
    ```

    Alternativamente, voce pode enviar a chave como query parameter (nao recomendado):
    ```
    GET https://api.wazerpay.com.br/api/v1/external/charges?api_key=sk_live_sua_chave_aqui
    ```

    ### Exemplo: Criar uma cobranca PIX

    ```bash
    # IMPORTANTE: Use o endpoint /api/v1/external/charges (com /external/)
    # Use chave SECRETA (sk_live_) - chave publica retornara 403
    curl -X POST https://api.wazerpay.com.br/api/v1/external/charges \
      -H "X-API-Key: sk_live_sua_chave_secreta_aqui" \
      -H "Content-Type: application/json" \
      -d '{
        "amount": 5000,
        "payment_method": "pix",
        "description": "Pedido #1234",
        "customer": {
          "name": "Joao Silva",
          "email": "joao@email.com",
          "document": "12345678900"
        }
      }'
    ```

    A resposta incluira o `pix_qr_code` e `pix_copy_paste` para o cliente efetuar o pagamento.

    > **ATENÇÃO:** O endpoint correto é `/api/v1/external/charges` (com `/external/`).
    > Usar `/api/v1/charges` (sem `/external/`) resultará em erro 500.

    ### Exemplo: Criar uma cobranca Cartao de Credito

    ```bash
    curl -X POST https://api.wazerpay.com.br/api/v1/external/charges \
      -H "X-API-Key: sk_live_sua_chave_secreta_aqui" \
      -H "Content-Type: application/json" \
      -d '{
        "amount": 15990,
        "payment_method": "credit_card",
        "description": "Assinatura Premium",
        "installments": 3,
        "customer": {
          "name": "Maria Santos",
          "email": "maria@email.com",
          "document": "98765432100"
        },
        "card": {
          "number": "4111111111111111",
          "holder_name": "MARIA SANTOS",
          "exp_month": "12",
          "exp_year": "2027",
          "cvv": "123"
        }
      }'
    ```

    ### Exemplo: Criar uma cobranca Boleto

    ```bash
    curl -X POST https://api.wazerpay.com.br/api/v1/external/charges \
      -H "X-API-Key: sk_live_sua_chave_secreta_aqui" \
      -H "Content-Type: application/json" \
      -d '{
        "amount": 29900,
        "payment_method": "boleto",
        "description": "Fatura mensal",
        "customer": {
          "name": "Carlos Souza",
          "email": "carlos@email.com",
          "document": "11122233344",
          "address": {
            "street": "Rua das Flores",
            "number": "123",
            "neighborhood": "Centro",
            "city": "Sao Paulo",
            "state": "SP",
            "zip_code": "01001000"
          }
        }
      }'
    ```

    A resposta incluira `boleto_url` (link do boleto) e `boleto_barcode` (codigo de barras).

    ### Erros de autenticacao

    | Codigo HTTP | Descricao |
    |---|---|
    | `401 Unauthorized` | API Key ausente, invalida ou expirada |
    | `403 Forbidden` | API Key nao possui permissao para este endpoint |
    | `429 Too Many Requests` | Limite de requisicoes excedido |

    ### Boas praticas

    - **Nunca exponha** sua chave secreta (`sk_live_`) no frontend ou codigo-fonte publico
    - Use chaves publicas (`pk_live_`) apenas no frontend/cliente (somente leitura)
    - Use chaves secretas (`sk_live_`) apenas no servidor (backend)
    - Use variaveis de ambiente para armazenar as chaves
    - Crie chaves separadas para cada ambiente (producao, staging, desenvolvimento)
    - Revogue chaves comprometidas imediatamente no painel
    - Use apenas as permissoes necessarias para cada integracao (principio do menor privilegio)

    ## Valores Monetarios

    **Todos os valores monetarios sao em centavos (integer).**
    Exemplo: R$ 100,50 = `10050`

    ## Idempotencia

    Endpoints de criacao suportam o header `Idempotency-Key` para evitar cobrancas duplicadas.

    ```bash
    curl -X POST https://api.wazerpay.com.br/api/v1/external/charges \
      -H "X-API-Key: sk_live_sua_chave_secreta_aqui" \
      -H "Idempotency-Key: pedido-1234-unique-id" \
      -H "Content-Type: application/json" \
      -d '{"amount": 5000, "payment_method": "pix", ...}'
    ```

    ## Webhooks

    Receba notificacoes automaticas quando o status de um pagamento mudar.

    ### Como funciona
    1. Cadastre uma URL no painel ou via API (`POST /v1/webhooks`)
    2. Escolha os eventos que deseja receber
    3. O WazerPay envia um `POST` na sua URL com os dados do evento
    4. Responda com HTTP `200` para confirmar o recebimento

    ### Eventos disponiveis
    | Evento | Descricao |
    |---|---|
    | `charge.created` | Cobranca criada |
    | `charge.paid` | Pagamento confirmado |
    | `charge.failed` | Pagamento falhou |
    | `charge.refunded` | Estorno realizado |
    | `charge.disputed` | Disputa aberta |
    | `payment.approved` | Pagamento aprovado |
    | `payment.rejected` | Pagamento rejeitado |
    | `payment.expired` | Pagamento expirado |
    | `payment.cancelled` | Pagamento cancelado |
    | `payment.chargedback` | Chargeback recebido |
    | `withdrawal.requested` | Saque solicitado |
    | `withdrawal.completed` | Saque concluido |
    | `*` | Todos os eventos |

    ### Exemplo de payload recebido
    ```json
    {
      "event": "charge.paid",
      "charge_id": "ea5069a7-84f9-4727-a455-de285a3eee4f",
      "status": "approved",
      "amount": 5000,
      "payment_method": "pix",
      "paid_at": "2026-02-23T14:30:00Z"
    }
    ```

    ### Retentativas
    Se sua URL nao responder com `200`, o WazerPay reenvia ate **5 vezes** com backoff exponencial (1min, 5min, 15min, 30min, 1h).

    ## Rate Limiting

    A API possui rate limiting de 1000 requisicoes por minuto.
    Os headers `X-RateLimit-Limit`, `X-RateLimit-Remaining` e `X-RateLimit-Reset` sao incluidos nas respostas.
