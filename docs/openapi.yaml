          $ref: '#/components/responses/ValidationError'

  /v1/splits/charges/{chargeId}:
    get:
      tags: [Split de Pagamento]
      summary: Listar splits de uma cobrança
      description: Retorna todos os splits gerados para uma cobrança específica.
      operationId: getChargeSplits
      security:
        - bearerAuth: []
