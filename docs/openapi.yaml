  # ==========================================
  # IP WHITELIST PARA SAQUES
  # ==========================================
  /v1/account/withdrawal-ips:
    get:
      tags: [Saques]
      summary: Listar IPs autorizados para saques
      description: |
        Retorna a lista de IPs autorizados para realizar saques via API.
        Se a lista estiver vazia, qualquer IP pode realizar saques.
      operationId: getWithdrawalIpWhitelist
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Lista de IPs
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      ips:
                        type: array
                        items:
                          type: string
                        example: ["177.10.20.30", "200.100.50.25"]
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags: [Saques]
      summary: Configurar IPs autorizados para saques
      description: |
        Define a lista de IPs autorizados a realizar saques via API Key.
        Máximo de **20 IPs**.

        - Se a lista estiver **vazia**, qualquer IP pode realizar saques.
        - Se a lista tiver IPs, **apenas requisições desses IPs** poderão solicitar saques.

        ### Exemplo

        ```bash
        curl -X PUT https://api.wazerpay.com.br/api/v1/account/withdrawal-ips \
          -H "X-API-Key: sk_live_sua_chave_secreta_aqui" \
          -H "Content-Type: application/json" \
          -d '{
            "ips": ["177.10.20.30", "200.100.50.25"]
          }'
        ```
      operationId: updateWithdrawalIpWhitelist
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ips]
              properties:
                ips:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: ipv4
                  description: Lista de IPs autorizados (vazio para permitir qualquer IP)
                  example: ["177.10.20.30", "200.100.50.25"]
      responses:
        '200':
          description: IPs atualizados
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      ips:
                        type: array
                        items:
                          type: string
                        example: ["177.10.20.30", "200.100.50.25"]
                  message:
                    type: string
                    example: IPs autorizados atualizados com sucesso.
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

