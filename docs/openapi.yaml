                enabled:
                  type: boolean
                  description: Se o split legado está ativo
      responses:
        '200':
          description: Configuração atualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/SplitConfig'
