          type: boolean
          default: false
        commission_percent:
          type: number
          description: Percentual de comissão para afiliados
          example: 40
        commission_fixed:
          type: integer
          description: Comissão fixa em centavos
        stock_enabled:
          type: boolean
          default: false
        stock_quantity:
          type: integer
        metadata:
          type: object
          additionalProperties: true

    # Webhooks
    Webhook:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          example: "https://meusite.com/webhooks/wazerpay"
        events:
          type: array
          items:
            type: string
          example: ["charge.paid", "charge.refunded"]
        is_active:
          type: boolean
          example: true
        secret:
          type:
            - string
            - 'null'
          description: Secret mascarado (apenas ultimos 4 caracteres visiveis)
          example: "****************************a1b2"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateWebhookRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          description: URL que recebera as notificacoes (deve aceitar POST)
          example: "https://meusite.com/webhooks/wazerpay"
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - charge.created
              - charge.paid
              - charge.failed
              - charge.refunded
              - charge.disputed
              - payment.approved
              - payment.rejected
              - payment.refunded
              - payment.expired
              - payment.cancelled
              - payment.chargedback
              - withdrawal.requested
              - withdrawal.completed
              - "*"
          description: Lista de eventos para receber. Use `*` para todos.
          example: ["charge.paid", "charge.refunded"]

    UpdateWebhookRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
          example: "https://meusite.com/webhooks/wazerpay"
        events:
          type: array
          minItems: 1
          items:
            type: string
          example: ["charge.paid", "charge.refunded", "payment.approved"]
        is_active:
          type: boolean
          description: Ativar ou desativar o webhook
          example: true

    WebhookPayload:
      type: object
      description: Payload enviado pelo WazerPay na URL cadastrada
      properties:
        event:
          type: string
          description: Tipo do evento
          example: charge.paid
        charge_id:
          type: string
          format: uuid
          example: ea5069a7-84f9-4727-a455-de285a3eee4f
        status:
          type: string
          example: approved
        amount:
          type: integer
          description: Valor em centavos
          example: 5000
        payment_method:
          type: string
          enum: [pix, credit_card, boleto]
          example: pix
        paid_at:
          type:
            - string
            - 'null'
          format: date-time

    # API Keys
    ApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Integração E-commerce
        type:
          type: string
          enum: [public, secret]
          description: |
            Tipo da chave:
            - `secret`: Acesso completo (sk_live_ / sk_test_). Para uso no servidor.
            - `public`: Somente leitura (pk_live_ / pk_test_). Para uso no frontend.
          example: secret
        key_prefix:
          type: string
          description: Prefixo da chave (para identificação)
          example: sk_live_a1b2
        environment:
          type: string
          enum: [production, sandbox]
          example: production
        permissions:
          type: array
          items:
            type: string
          description: |
            Permissões da chave. Chaves secretas tem `['*']` por padrão.
            Chaves públicas só aceitam permissões de leitura.
          example: ['*']
        last_used_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    # Common
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Credenciais inválidas
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Os dados fornecidos são inválidos
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email: ["O campo email é obrigatório."]
            amount: ["O campo valor deve ser no mínimo 100."]

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 15
        total:
          type: integer
          example: 142
        last_page:
          type: integer
          example: 10

    # ==========================================
    # SPLIT DE PAGAMENTO
    # ==========================================
    SplitConfig:
      type: object
      description: Configuração de split da conta
      properties:
        affiliate_id:
          type: string
          format: uuid
          nullable: true
          description: ID da conta afiliada (split legado)
        affiliate_percentage:
          type: number
          description: Percentual do afiliado (0-100)
          example: 10
        enabled:
          type: boolean
          description: Se o split legado está ativo
        rules_count:
          type: integer
          description: Quantidade de regras automáticas ativas
          example: 3

    SplitRule:
      type: object
      description: Regra de split automático
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        name:
          type: string
          description: Nome identificador da regra
          example: "Regra Padrão - 2 Destinatários"
        product_id:
          type: string
          format: uuid
          nullable: true
          description: ID do produto (null = aplica a todos)
        checkout_id:
          type: string
          format: uuid
          nullable: true
          description: ID do checkout (null = aplica a todos)
        is_default:
          type: boolean
          description: Se é a regra padrão (usada quando nenhuma específica aplica)
        is_active:
          type: boolean
          description: Se a regra está ativa
        priority:
          type: integer
          description: Prioridade (menor = maior prioridade)
          example: 0
        recipients:
          type: array
          description: Lista de destinatários do split
          items:
            $ref: '#/components/schemas/SplitRecipient'
        charge_fee_to_producer:
          type: boolean
          description: Se a taxa da transação é cobrada do produtor (true) ou distribuída (false)
        minimum_amount:
          type: integer
          description: Valor mínimo em centavos para aplicar esta regra
          example: 0
        auto_process:
          type: boolean
          description: Se os splits são processados automaticamente após criação
        transfer_delay_hours:
          type: integer
          description: Horas de espera antes de processar o split
          example: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SplitRecipient:
      type: object
      description: Destinatário de um split
      required: [recipient_id, recipient_type, type, value]
      properties:
        recipient_id:
          type: string
          format: uuid
          description: ID do destinatário (account_id ou identificador externo)
        recipient_type:
          type: string
          enum: [account, affiliate, external]
          description: |
            Tipo do destinatário:
            - **account**: Conta WazerPay (credita no wallet)
            - **affiliate**: Afiliado (credita no wallet)
            - **external**: Conta externa (transferência manual)
        type:
          type: string
          enum: [percentage, fixed]
          description: |
            Tipo de divisão:
            - **percentage**: Percentual do valor (ex: 10 = 10%)
            - **fixed**: Valor fixo em centavos (ex: 500 = R$ 5,00)
        value:
          type: number
          description: Valor do split (percentual ou centavos conforme o tipo)
          example: 10
        description:
          type: string
          nullable: true
          description: Descrição opcional do split
          example: "Comissão do afiliado"

    CreateSplitRuleRequest:
      type: object
      required: [name, recipients]
      properties:
        name:
          type: string
          maxLength: 255
          description: Nome da regra
          example: "Regra Padrão"
        product_id:
          type: string
          format: uuid
          nullable: true
          description: Vincular a um produto específico
        checkout_id:
          type: string
          format: uuid
          nullable: true
          description: Vincular a um checkout específico
        is_default:
          type: boolean
          default: false
          description: Definir como regra padrão
        is_active:
          type: boolean
          default: true
        priority:
          type: integer
          default: 0
          minimum: 0
        recipients:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/SplitRecipient'
        charge_fee_to_producer:
          type: boolean
          default: true
        minimum_amount:
          type: integer
          default: 0
          minimum: 0
        auto_process:
          type: boolean
          default: true
        transfer_delay_hours:
          type: integer
          default: 0
          minimum: 0

    UpdateSplitRuleRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        product_id:
          type: string
          format: uuid
          nullable: true
        checkout_id:
          type: string
          format: uuid
          nullable: true
        is_default:
          type: boolean
        is_active:
          type: boolean
        priority:
          type: integer
          minimum: 0
        recipients:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/SplitRecipient'
        charge_fee_to_producer:
          type: boolean
        minimum_amount:
          type: integer
          minimum: 0
        auto_process:
          type: boolean
        transfer_delay_hours:
          type: integer
          minimum: 0

    Split:
      type: object
      description: Registro de split de uma cobrança
      properties:
        id:
          type: string
          format: uuid
        charge_id:
          type: string
          format: uuid
        transaction_id:
          type: string
          format: uuid
          nullable: true
        recipient_id:
          type: string
          format: uuid
        recipient_type:
          type: string
          enum: [account, affiliate, external]
        type:
          type: string
          enum: [percentage, fixed]
        amount:
          type: integer
          description: Valor bruto em centavos
        percentage:
          type: number
          description: Percentual aplicado
        fee_amount:
          type: integer
          description: Valor da taxa em centavos
        net_amount:
          type: integer
          description: Valor líquido em centavos
        status:
          type: string
          enum: [pending, processing, transferred, failed]
        transferred_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    SplitSimulation:
      type: object
      description: Resultado da simulação de split
      properties:
        rule:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        input:
          type: object
          properties:
            amount:
              type: integer
              description: Valor informado em centavos
            fee_amount:
              type: integer
              description: Taxa informada em centavos
        splits:
          type: array
          description: Lista de splits que seriam criados
          items:
            type: object
            properties:
              recipient_id:
                type: string
                format: uuid
              recipient_type:
                type: string
              type:
                type: string
              value:
                type: number
              amount:
                type: integer
                description: Valor calculado em centavos
              fee_amount:
                type: integer
              net_amount:
                type: integer
              description:
                type: string
                nullable: true
        totals:
          type: object
          properties:
            total_split_amount:
              type: integer
              description: Soma de todos os splits em centavos
            producer_amount:
              type: integer
              description: Valor que fica com o produtor em centavos
            split_count:
              type: integer
              description: Quantidade de splits

  responses:
    Unauthorized:
      description: Token JWT inválido ou expirado
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Token inválido ou expirado
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Recurso não encontrado
    ValidationError:
      description: Erro de validação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
