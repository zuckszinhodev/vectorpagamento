  /v1/checkout/{slug}/process:
    post:
      tags: [Checkout Público]
      summary: Processar pagamento do checkout
      description: |
        Processa o pagamento de um checkout público. Este é o endpoint principal para realizar pagamentos.

        ### Fluxo PIX
        1. Envie `payment_method: "pix"` com os dados do cliente
        2. Receba o `pix_qr_code` e `pix_copy_paste` na resposta
        3. Exiba o QR Code para o cliente
        4. Faça polling no endpoint `GET /v1/checkout/charge/{chargeId}/status` para verificar o pagamento
        5. Quando `status` mudar para `approved`, o pagamento foi confirmado

        ### Fluxo Cartão de Crédito
        1. Envie `payment_method: "credit_card"` com dados do cartão e cliente
        2. A resposta já terá `status: "approved"` se aprovado, ou `status: "rejected"` se recusado

        ### Fluxo Boleto
        1. Envie `payment_method: "boleto"` com os dados do cliente
        2. Receba `boleto_url` e `boleto_barcode` na resposta
        3. Redirecione o cliente para o boleto ou exiba o código de barras
      operationId: processCheckoutPayment
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          example: curso-marketing-digital
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessPaymentRequest'
            examples:
              pix:
                summary: Pagamento PIX
                value:
                  payment_method: pix
                  customer:
                    name: Maria Santos
                    email: maria@email.com
                    document: "12345678900"
                    phone: "11999998888"
              cartao:
                summary: Pagamento Cartão
                value:
                  payment_method: credit_card
                  installments: 3
                  customer:
                    name: Ana Costa
                    email: ana@email.com
                    document: "11122233344"
                    phone: "11988887777"
                  card:
                    number: "4111111111111111"
                    holder_name: ANA COSTA
                    exp_month: "12"
                    exp_year: "2028"
                    cvv: "123"
                  billing:
                    street: Rua das Flores
                    number: "100"
                    neighborhood: Centro
                    city: São Paulo
                    state: SP
                    zip_code: "01001000"
              boleto:
                summary: Pagamento Boleto
                value:
                  payment_method: boleto
                  customer:
                    name: Carlos Oliveira
                    email: carlos@email.com
                    document: "98765432100"
                    phone: "21977776666"
      responses:
        '201':
          description: Pagamento processado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ChargeResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Checkout não encontrado

  /v1/checkout/charge/{chargeId}/status:
    get:
      tags: [Checkout Público]
      summary: Verificar status do pagamento
      description: |
        Verifica o status atual de uma cobrança. Use para polling após gerar um PIX ou boleto.

        **Recomendação:** Faça polling a cada 3-5 segundos por no máximo 30 minutos para PIX.
      operationId: checkPaymentStatus
      parameters:
        - name: chargeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID da cobrança
      responses:
        '200':
          description: Status da cobrança
          content:
            application/json:
              schema:
                type: object
                properties:
                  charge_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [pending, approved, expired, cancelled, refunded, rejected]
                    description: |
                      - `pending` - Aguardando pagamento
                      - `approved` - Pagamento confirmado
                      - `expired` - Expirado (PIX não pago a tempo)
                      - `cancelled` - Cancelado
                      - `refunded` - Estornado
                      - `rejected` - Recusado pelo adquirente
                  payment_method:
                    type: string
                    enum: [pix, credit_card, boleto]
                  amount:
                    type: integer
                    description: Valor em centavos
                  paid_at:
                    type: string
                    format: date-time
                    nullable: true
                  synced:
                    type: boolean
              example:
                charge_id: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
                status: approved
                payment_method: pix
                amount: 10050
                paid_at: "2026-02-16T15:30:00Z"
                synced: true

