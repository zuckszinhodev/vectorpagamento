      responses:
        '200':
          description: Configuração de split
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/SplitConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Split de Pagamento]
      summary: Atualizar configuração legada de split
      description: |
        Atualiza a configuração legada de split (afiliado).
        Para configurações avançadas, use as rotas de regras (`/v1/splits/rules`).
      operationId: updateSplitConfig
      security:
        - bearerAuth: []
      requestBody:
        required: true
