version: '3.8'

services:
  # ===========================================
  # Backend API (Laravel)
  # ===========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wazerpay-backend
    restart: unless-stopped
    env_file: ./backend/.env.production
    environment:
      SENTRY_LARAVEL_DSN: ${SENTRY_LARAVEL_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.2}
    volumes:
      - backend-storage:/var/www/html/storage
      - backend-database:/var/www/html/database
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - wazerpay-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================
  # Frontend (React/Vite)
  # ===========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.wazerpay.com.br/api}
    container_name: wazerpay-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - wazerpay-network

  # ===========================================
  # Redis (Cache + Queue)
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: wazerpay-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD env var is required} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - wazerpay-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Nginx Reverse Proxy
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: wazerpay-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - wazerpay-network

  # ===========================================
  # Evolution API (WhatsApp)
  # ===========================================
  evolution-api:
    image: atendai/evolution-api:latest
    container_name: wazerpay-evolution
    restart: unless-stopped
    environment:
      - SERVER_URL=${EVOLUTION_API_URL:-https://evolution.wazerpay.com.br}
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-change-me-in-production}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=${EVOLUTION_DB_URI:-postgresql://postgres:postgres@evolution-db:5432/evolution}
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - REDIS_ENABLED=true
      - REDIS_URI=redis://:${REDIS_PASSWORD}@redis:6379/1
      - LOG_LEVEL=ERROR
      - DEL_INSTANCE=false
      - WEBHOOK_GLOBAL_ENABLED=false
      - WEBHOOK_GLOBAL_URL=
      - CONFIG_SESSION_PHONE_CLIENT=WazerPay
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - evolution-instances:/evolution/instances
    depends_on:
      redis:
        condition: service_healthy
      evolution-db:
        condition: service_healthy
    networks:
      - wazerpay-network

  # ===========================================
  # PostgreSQL for Evolution API
  # ===========================================
  evolution-db:
    image: postgres:15-alpine
    container_name: wazerpay-evolution-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${EVOLUTION_DB_USER:-postgres}
      - POSTGRES_PASSWORD=${EVOLUTION_DB_PASSWORD:-postgres}
      - POSTGRES_DB=evolution
    volumes:
      - evolution-db-data:/var/lib/postgresql/data
    networks:
      - wazerpay-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVOLUTION_DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
    driver: local
  backend-storage:
    driver: local
  backend-database:
    driver: local
  evolution-instances:
    driver: local
  evolution-db-data:
    driver: local

networks:
  wazerpay-network:
    driver: bridge
