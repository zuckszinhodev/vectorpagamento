# ===========================================
# WazerPay - Catch-All for Custom Domains & Subdomains
# ===========================================
# Deploy:
#   cp docker/nginx/production-server.conf /etc/nginx/sites-available/wazerpay-wildcard
#   ln -sf /etc/nginx/sites-available/wazerpay-wildcard /etc/nginx/sites-enabled/wazerpay-wildcard
#   nginx -t && systemctl restart nginx
#
# This handles:
#   - teste.wazerpay.com.br (WazerPay user subdomains)
#   - meusite.com (custom domains)
#
# Existing configs for api.wazerpay.com.br and app.wazerpay.com.br
# remain untouched in their own files.
# ===========================================

# Rate limiting zones (skip if already defined in main nginx.conf)
# If you get "duplicate zone" errors, remove these two lines:
limit_req_zone $binary_remote_addr zone=wildcard_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=wildcard_auth:10m rate=5r/s;

# ===========================================
# HTTP → HTTPS redirect for wildcard subdomains
# ===========================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Block system subdomains
    if ($host ~* "^(api|app|www|checkout|pay|members)\.(wazerpay\.com(\.br)?)$") {
        return 444;
    }

    return 301 https://$host$request_uri;
}

# ===========================================
# HTTPS catch-all for wildcard subdomains + custom domains
# Uses the same Cloudflare Origin Certificate as api.wazerpay.com.br
# ===========================================
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Use existing Cloudflare Origin Certificate (covers *.wazerpay.com.br)
    ssl_certificate /etc/nginx/ssl/wazerpay.crt;
    ssl_certificate_key /etc/nginx/ssl/wazerpay.key;

    root /var/www/wazerpay-gateway/frontend/dist;
    index index.html;

    client_max_body_size 20M;

    # Block system subdomains to prevent loops
    set $is_system 0;
    if ($host ~* "^(api|app|www|checkout|pay|members)\.(wazerpay\.com(\.br)?)$") {
        set $is_system 1;
    }
    if ($host = "wazerpay.com") {
        set $is_system 1;
    }
    if ($host = "wazerpay.com.br") {
        set $is_system 1;
    }
    if ($is_system = 1) {
        return 444;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # API routes → Laravel backend (preserves Host for domain resolution middleware)
    location /api/ {
        limit_req zone=wildcard_api burst=20 nodelay;

        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/wazerpay-gateway/backend/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;

        # Preserve original Host so ResolveCustomDomain middleware works
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_CF_CONNECTING_IP $http_cf_connecting_ip;

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Storage/uploads from backend
    location /storage/ {
        alias /var/www/wazerpay-gateway/backend/storage/app/public/;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: all routes → index.html
    # Frontend detects custom domain and shows checkout/member area
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny hidden files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/wildcard.wazerpay-access.log;
    error_log /var/log/nginx/wildcard.wazerpay-error.log;
}
