# ===========================================
# Vector Pagamentos - Catch-All for Custom Domains & Subdomains
# ===========================================
# Deploy:
#   cp docker/nginx/production-server.conf /etc/nginx/sites-available/vectorpagamentos-wildcard
#   ln -sf /etc/nginx/sites-available/vectorpagamentos-wildcard /etc/nginx/sites-enabled/vectorpagamentos-wildcard
#   nginx -t && systemctl restart nginx
#
# This handles:
#   - teste.vectorpagamentos.com (Vector Pagamentos user subdomains)
#   - meusite.com (custom domains)
#
# Existing configs for api.vectorpagamentos.com and app.vectorpagamentos.com
# remain untouched in their own files.
# ===========================================

# Rate limiting zones (skip if already defined in main nginx.conf)
# If you get "duplicate zone" errors, remove these two lines:
limit_req_zone $binary_remote_addr zone=wildcard_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=wildcard_auth:10m rate=5r/s;

# ===========================================
# HTTP → HTTPS redirect for wildcard subdomains
# ===========================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    # Block system subdomains
    if ($host ~* "^(api|app|www|checkout|pay|members)\.(vectorpagamentos\.com)$") {
        return 444;
    }

    return 301 https://$host$request_uri;
}

# ===========================================
# HTTPS catch-all for wildcard subdomains + custom domains
# Uses the same Cloudflare Origin Certificate as api.vectorpagamentos.com
# ===========================================
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;

    # Use existing Cloudflare Origin Certificate (covers *.vectorpagamentos.com)
    ssl_certificate /etc/nginx/ssl/vectorpagamentos.crt;
    ssl_certificate_key /etc/nginx/ssl/vectorpagamentos.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_prefer_server_ciphers off;

    root /var/www/vectorpagamentos-gateway/frontend/dist;
    index index.html;

    client_max_body_size 20M;

    # Block system subdomains to prevent loops
    set $is_system 0;
    if ($host ~* "^(api|app|www|checkout|pay|members)\.(vectorpagamentos\.com)$") {
        set $is_system 1;
    }
    if ($host = "vectorpagamentos.com") {
        set $is_system 1;
    }
    if ($host = "vectorpagamentos.com") {
        set $is_system 1;
    }
    if ($is_system = 1) {
        return 444;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # API routes → Laravel backend (preserves Host for domain resolution middleware)
    location /api/ {
        limit_req zone=wildcard_api burst=20 nodelay;

        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/vectorpagamentos-gateway/backend/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;

        # Preserve original Host so ResolveCustomDomain middleware works
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_CF_CONNECTING_IP $http_cf_connecting_ip;

        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header Server;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Storage/uploads from backend
    location /storage/ {
        alias /var/www/vectorpagamentos-gateway/backend/storage/app/public/;
        expires 1d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # SPA: all routes → index.html
    # Frontend detects custom domain and shows checkout/member area
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Deny hidden files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/wildcard.vectorpagamentos-access.log;
    error_log /var/log/nginx/wildcard.vectorpagamentos-error.log;
}
