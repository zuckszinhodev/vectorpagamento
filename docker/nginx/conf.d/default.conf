# ===========================================
# API - api.vectorpagamentos.com
# ===========================================
# Cloudflare handles SSL termination
# Origin uses HTTP (Cloudflare Flexible SSL)
# Or use Cloudflare Origin Certificate for Full (Strict)
# ===========================================

upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:3000;
    keepalive 16;
}

# Redirect HTTP to HTTPS (Cloudflare handles this, but just in case)
server {
    listen 80;
    server_name api.vectorpagamentos.com;

    # Cloudflare health check
    location /health {
        proxy_pass http://backend_upstream/api/health;
        proxy_set_header Host $host;
    }

    # API routes
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;

        # CORS is handled by Laravel (config/cors.php).
        # Do NOT add CORS headers here — duplicates conflict with
        # supports_credentials=true (wildcard * is rejected by browsers).

        # Preflight handled by Laravel; if needed as fallback:
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "https://app.vectorpagamentos.com" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key, X-Requested-With, X-Idempotency-Key" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # Auth endpoints - stricter rate limiting
    location /api/v1/auth/ {
        # Keep explicit CORS headers here so browser can read 4xx/5xx too
        # (especially when auth rate limiting is triggered at nginx level).
        add_header Access-Control-Allow-Origin "https://app.vectorpagamentos.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key, X-Requested-With, X-Idempotency-Key" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary "Origin, Access-Control-Request-Method, Access-Control-Request-Headers" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        limit_req_status 429;
        limit_req zone=auth burst=5 nodelay;

        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Webhook callbacks (no rate limit)
    location /api/v1/webhooks/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeout for webhook processing
        proxy_read_timeout 120s;
    }

    # Checkout public pages
    location /checkout/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Landing pages
    location /lp/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Storage/uploads
    location /storage/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ===========================================
# Frontend - app.vectorpagamentos.com (optional)
# ===========================================
# Use this if frontend is on a separate subdomain
# Otherwise, Cloudflare Pages or similar can serve the frontend

server {
    listen 80;
    server_name app.vectorpagamentos.com vectorpagamentos.com;

    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API proxy from frontend
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ===========================================
# Custom Domains - catch-all for client domains
# ===========================================
# Handles requests from custom domains like:
#   pay.clientsite.com, members.clientsite.com, clientsite.com
# Cloudflare proxies these to our server, nginx routes to backend
# which resolves the domain via ResolveCustomDomain middleware.

server {
    listen 80 default_server;
    server_name _;

    # Prevent loops with system domains
    # Only block exact system subdomains (api, app, www, checkout, pay, members)
    # User Vector Pagamentos subdomains (e.g., meusite.vectorpagamentos.com) should pass through
    set $is_system 0;
    if ($host = "vectorpagamentos.com") {
        set $is_system 1;
    }
    if ($host = "vectorpagamentos.com") {
        set $is_system 1;
    }
    if ($host ~* "^(api|app|www|checkout|pay|members)\.(vectorpagamentos\.com)$") {
        set $is_system 1;
    }
    if ($is_system = 1) {
        return 444;
    }

    # Health check for Cloudflare
    location /health {
        proxy_pass http://backend_upstream/api/health;
        proxy_set_header Host $host;
    }

    # API routes - custom domain checkout & member area resolution
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Serve checkout/member area frontend for custom domains
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Storage/uploads
    location /storage/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
